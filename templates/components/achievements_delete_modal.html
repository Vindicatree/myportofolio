<button type="button"
        class="achievement-delete-btn"
        popovertarget="delete-achievement-{{ achievement.id }}"
        aria-label="Hapus {{ achievement.title }}"
        title="Hapus achievement">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    </svg>
    Hapus Achievement
</button>

<div id="delete-achievement-{{ achievement.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-achievement-title-{{ achievement.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-achievement-{{ achievement.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-achievement-{{ achievement.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-achievement-title-{{ achievement.id }}">Hapus Achievement?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ achievement.title }}</strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-achievement-{{ achievement.id }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_achievement' achievement.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
